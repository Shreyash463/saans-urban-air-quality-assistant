name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint, Typecheck, Coverage & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npx jscpd src --min-lines 5 --min-tokens 50 --threshold 3 --reporters console
      - run: npx knip --no-config-hints
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm audit signatures
      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --omit=dev > frontend-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.cdx.json
          retention-days: 30

  backend:
    name: Backend Lint, Typecheck, Test (>=90%) & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - working-directory: backend
        run: |
          ruff check app tests scripts
          mypy app
          python scripts/export_contract.py --check
          test -z "$(radon cc app -n C)"
          vulture app --min-confidence 80
          python -c "import ast; from pathlib import Path; bad = [str(p) for p in Path('app').rglob('*.py') if len(p.read_text().splitlines()) > 300 or any((n.end_lineno - n.lineno + 1) > 50 for n in ast.walk(ast.parse(p.read_text())) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)))]; assert not bad, bad"
          pytest --cov=app --cov-branch --cov-report=term-missing
          pip-audit -r requirements.txt
          pip-audit -r requirements.txt --format cyclonedx-json -o ../backend-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          retention-days: 30

  e2e:
    name: Playwright E2E (Chromium + FastAPI SPA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci --ignore-scripts && npm run build
      - working-directory: .
        run: pip install --require-hashes -r backend/requirements.txt

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: saans-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name saans-ci -p 8000:8000 -e ENVIRONMENT=production saans-assistant:ci
          trap 'docker rm -f saans-ci' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"commitSha"'
          curl -fsS http://127.0.0.1:8000/.well-known/security.txt | grep -q "Contact:"
          curl -fsS http://127.0.0.1:8000/ | grep -qi "Saans"
          docs_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/docs)
          test "$docs_status" = "404"

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks history & tree scan
        run: |
          GITLEAKS_VER=8.24.2
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VER}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact --verbose
