name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint, Typecheck, Coverage & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev

  backend:
    name: Backend Lint, Typecheck, Test (>=90%) & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: |
          ruff check app tests scripts
          mypy app
          pytest --cov=app --cov-report=term-missing
          pip-audit -r requirements.txt

  e2e:
    name: Playwright E2E (Chromium + FastAPI SPA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci && npm run build
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: saans-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name saans-ci -p 8000:8000 -e ENVIRONMENT=production saans-assistant:ci
          trap 'docker rm -f saans-ci' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"commitSha"'
          curl -fsS http://127.0.0.1:8000/ | grep -qi "Saans"
          docs_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/docs)
          test "$docs_status" = "404"

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks history & tree scan
        run: |
          GITLEAKS_VER=8.24.2
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VER}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact --verbose
