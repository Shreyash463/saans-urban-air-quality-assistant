name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          output: sarif-results
          upload: 'false'

      - name: Verify zero CodeQL findings in SARIF
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, json, sys

          sarifs = sorted(glob.glob("sarif-results/*.sarif"))
          if not sarifs:
              print("ERROR: No SARIF files produced by CodeQL.")
              sys.exit(1)

          findings = []
          for path in sarifs:
              data = json.load(open(path, encoding="utf-8"))
              for run in data.get("runs", []):
                  rules = len(run.get("tool", {}).get("driver", {}).get("rules", []))
                  res = run.get("results", [])
                  print(f"{path}: rules={rules} findings={len(res)}")
                  for item in res:
                      findings.append((path, item.get("ruleId"), item.get("level"), item.get("message", {}).get("text")))

          if findings:
              for f in findings:
                  print("FINDING:", f)
              sys.exit(1)
          print("CodeQL verification passed: 0 security findings.")
          EOF

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/*.sarif
          retention-days: 14
